[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betavolt-screening"
version = "1.0.0"
description = "Информационно-аналитическая система и библиотека скрининга бетавольтаических материалов"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Master Student in Data Science" }
]
dependencies = [
    "mp-api",
    "pymatgen",
    "matminer",
    "pandas",
    "numpy",
    "scipy",
    "catboost",
    "scikit-learn",
    "shap",
    "plotly",
    "streamlit"
]